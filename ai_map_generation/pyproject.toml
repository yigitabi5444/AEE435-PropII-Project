[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-map-generation"
version = "0.1.0"
description = "Autoencoder-based reconstruction of turbojet component maps"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2",
    "torch>=2.1",
    "matplotlib>=3.9",
    "PySide6>=6.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
